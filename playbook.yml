---
- name: Deploy transfer scripts
  hosts: "{{ lookup('ansible.builtin.env', 'TARGET_HOSTS', default='windows') }}"
  gather_facts: false
  vars:
    transfer_id: "{{ lookup('ansible.builtin.env', 'TRANSFER_ID') }}"
    reset_acl: "{{ lookup('ansible.builtin.env', 'RESET_ACL', default='false') }}"
    cfg: "{{ transfer[transfer_id] }}"
    destination_base_dir: "{{ cfg.destination_base_dir }}"

  pre_tasks:
    - name: Validate TRANSFER_ID
      ansible.builtin.assert:
        that:
          - transfer_id | length > 0
          - transfer_id in transfer
          - cfg.destination_base_dir | default('') | length > 0
        fail_msg: "TRANSFER_ID empty, unknown or without destination_base_dir: '{{ transfer_id }}'"
        quiet: true

  tasks:
    - name: Deploy common scripts to "{{ destination_base_dir }}"
      ansible.windows.win_copy:
        src: "./files/common_scripts/{{ item.0 }}"
        dest: "{{ destination_base_dir }}/{{ item.1 }}/"
      loop: "{{ cfg.common_scripts_to_deploy | product(cfg.common_scripts_path) }}"
      loop_control:
        label: "{{ item.0 | basename }} -> {{ item.1 }}"

    - name: Deploy specific scripts and parameter files to "{{ destination_base_dir }}"
      ansible.windows.win_copy:
        src: "./files/{{ transfer_id }}/"
        dest: "{{ destination_base_dir }}/"

    - name: Set permissions for technical user
      when: cfg.tech_user | default('') | length > 0
      block:
        - name: Check that "{{ destination_base_dir }}" exists
          ansible.windows.win_stat:
            path: "{{ destination_base_dir }}"
          register: base_dir_stat

        - name: Reset ACLs on "{{ destination_base_dir }}" (one-shot, RESET_ACL=true)
          when: reset_acl | bool
          ansible.windows.win_command:
            cmd: icacls "{{ destination_base_dir }}" /reset /T /C /Q

        - name: Grant Modify on "{{ destination_base_dir }}" to "{{ cfg.tech_user }}"
          when: not ansible_check_mode or base_dir_stat.stat.exists
          ansible.windows.win_acl:
            path: "{{ destination_base_dir }}"
            user: "{{ cfg.tech_user }}"
            rights: Modify
            type: allow
            state: present

        - name: Harden secrets folder
          when: cfg.secrets_path | default('') | length > 0
          vars:
            secrets_dir: "{{ destination_base_dir }}/{{ cfg.secrets_path }}"
          block:
            - name: Check that "{{ secrets_dir }}" exists
              ansible.windows.win_stat:
                path: "{{ secrets_dir }}"
              register: secrets_dir_stat

            - name: Apply ACLs on "{{ secrets_dir }}"
              when: not ansible_check_mode or secrets_dir_stat.stat.exists
              block:
                - name: Set owner to BUILTIN\Administrators
                  ansible.windows.win_owner:
                    path: "{{ secrets_dir }}"
                    user: BUILTIN\Administrators
                    recurse: true

                - name: Add explicit ACEs (inherited by files)
                  ansible.windows.win_acl:
                    path: "{{ secrets_dir }}"
                    user: "{{ item.user }}"
                    rights: "{{ item.rights }}"
                    type: allow
                    state: present
                  loop:
                    - { user: SYSTEM, rights: FullControl }
                    - { user: BUILTIN\Administrators, rights: FullControl }
                    - { user: "{{ cfg.tech_user }}", rights: Read }
                  loop_control:
                    label: "{{ item.user }}: {{ item.rights }}"

                - name: Disable inheritance from parent
                  ansible.windows.win_acl_inheritance:
                    path: "{{ secrets_dir }}"
                    state: absent
                    reorganize: false

    - name: Write version file "{{ destination_base_dir }}/version.txt"
      ansible.windows.win_copy:
        dest: "{{ destination_base_dir }}/version.txt"
        content: |
          Gitlab project  : {{ lookup('ansible.builtin.env', 'CI_PROJECT_URL') }}
          Commit ref      : {{ lookup('ansible.builtin.env', 'CI_COMMIT_REF_NAME') }}
          Commit SHA      : {{ lookup('ansible.builtin.env', 'CI_COMMIT_SHA') }}
          User            : {{ lookup('ansible.builtin.env', 'GITLAB_USER_LOGIN') }} ({{ lookup('ansible.builtin.env', 'GITLAB_USER_NAME') }})
          Deployment date : {{ now(fmt='%d.%m.%Y %H:%M:%S') }}
